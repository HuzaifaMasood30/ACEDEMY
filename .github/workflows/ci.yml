name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_pw
          POSTGRES_DB: academy_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://academy:academy_ci_pw@127.0.0.1:5432/academy_erp?schema=public
      # CI-only values. Not secrets: they exist so the app can boot in this job.
      AUTH_SECRET: ci-only-secret-not-used-in-production-000000000000
      AUTH_TRUST_HOST: 'true'
      APP_URL: http://localhost:3000
      WHATSAPP_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The portal redirect bug was invisible to unit tests: sign-in succeeded,
      # so nothing failed, but every role was dropped on the public homepage.
      # This drives a real browser through each portal to catch that class of
      # regression. See scripts/check-portal-login.mjs.
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Start the application
        run: |
          npx next start -p 3000 > /tmp/next-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start. Log:"
          cat /tmp/next-server.log
          exit 1

      - name: Portal sign-in end-to-end
        env:
          BASE: http://127.0.0.1:3000
        run: node scripts/check-portal-login.mjs
