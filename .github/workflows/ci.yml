name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_pw
          POSTGRES_DB: academy_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://academy:academy_ci_pw@127.0.0.1:5432/academy_erp?schema=public
      # CI-only values. Not secrets: they exist so the app can boot in this job.
      AUTH_SECRET: ci-only-secret-not-used-in-production-000000000000
      AUTH_TRUST_HOST: 'true'
      APP_URL: http://localhost:3000
      WHATSAPP_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
